
<header>
  <div class="wrap-container">
    <div class="branding">
      <img class="logo-lg" src="/logo.png" alt="Logo">
      <span class="branding-text">Agroempleo</span>
    </div>

    <nav class="menu">
      <ul class="listMenu" [class.open]="isMenuOpen">
      
        <li><a routerLink="/home">Inicio</a></li>
        <li><a routerLink="/busqueda-empleo">Búsqueda de empleo</a></li>
        <li><a routerLink="/contacto">Contacto</a></li>
        <li><a routerLink="/login">Login</a></li>
      </ul>
      <button class="mobileMenuButton" (click)="toggleMenu()">
        <span></span>
      </button>
    </nav>
  </div>
</header>
<body>

  <div class="job-board-wrapper">

    <!-- Encabezado superior -->
    <header class="job-header">
      <img src="assets/logo.svg" alt="Logo Agroempleo" class="logo">
      <nav class="top-nav">
        <a href="#">Encontrar Trabajo</a>
        <a href="#">Reseña de la Empresa</a>
        <a href="#">Encontrar Salarios</a>
      </nav>
      <div class="user-profile">
        <span class="user-name">Luis Lopez</span>
        <img src="assets/user.png" alt="Usuario" class="avatar">
      </div>
    </header>
  
    <main class="job-main">
  
      <!-- Filtro lateral -->
      <aside class="job-sidebar">

        <div class="filter-group">
          <label for="jobType">Tipo de Empleo:</label>
          <select id="jobType" name="jobType" [(ngModel)]="selectedJobType" required>
            <option value="">Seleccione</option>
            <option value="full-time">Tiempo Completo</option>
            <option value="part-time">Medio Tiempo</option>
            <option value="remote">Remoto</option>
            <option value="internship">Prácticas</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="jobType">Nivel de Señioridad:</label>
          <select id="jobType" name="jobType" [(ngModel)]="selectedJobType2" required>
            <option value="">Seleccione</option>
            <option value="full-time">Medio</option>
            <option value="part-time">señior</option>
            <option value="remote">Estudiante</option>
            <option value="internship">Director</option>
          </select>
        </div>
      </aside>
  
      <!-- Contenido principal de empleos -->
      <section class="job-results">
        <div class="results-header">
          <h2>Mostrando {{ jobs.length }} empleos</h2>
          <input type="text" placeholder="Buscar Empleo" />
        </div>
  
        <div class="job-cards">
          <div class="job-card" *ngFor="let job of jobs">
            <div class="card-header">
              <img [src]="job.logo" alt="Logo Empresa" class="job-logo" />
              <div class="job-info">
                <h3>{{ job.title }}</h3>
                <p>{{ job.description }}</p>
              </div>
              <div class="job-menu">⋮</div>
            </div>
  
            <div class="card-footer">
              <div class="tags">
                <span *ngFor="let tag of job.tags">{{ tag }}</span>
              </div>
              <div class="actions">
                <button class="btn-apply">Aplicar Ahora</button>
                <button class="btn-msg">Mensajes</button>
              </div>
            </div>
          </div>
        </div>
      </section>
  
    </main>
  
  </div>
