<app-user-header></app-user-header>
<div class="container">
  <h1 class="title">Cursos recomendados</h1>

  <mat-form-field appearance="outline" class="search-bar">
    <mat-label>Buscar curso</mat-label>
    <input matInput [(ngModel)]="searchText" (input)="filterLearnings()" placeholder="Ej: Excel, Inglés, etc.">
    <button mat-icon-button *ngIf="searchText" matSuffix (click)="searchText=''; filterLearnings()">
      <mat-icon>close</mat-icon>
    </button>
  </mat-form-field>

  <button *ngIf="tipoUsuario === 'Empleador'" mat-raised-button color="primary" (click)="abrirModal()">+ Nuevo Learning</button>

  <div class="card-grid">
    <mat-card *ngFor="let learning of filteredLearnings" class="learning-card">
      <img mat-card-image [src]="learning.Imagenes || 'https://via.placeholder.com/300x180'" alt="Imagen del curso">
      <mat-card-content>
        <h3>{{ learning.TextoAprendizaje }}</h3>
        <div *ngIf="learning.Videos">
          <p><strong>Video:</strong></p>
          <iframe
            width="100%"
            height="200"
            [src]="learning.Videos | safeUrl"
            frameborder="0"
            allowfullscreen>
          </iframe>
        </div>
      </mat-card-content>
    </mat-card>
  </div>

  <!-- Modal -->
  <div class="modal-backdrop" *ngIf="showModal">
    <div class="modal">
      <h2>Nuevo Learning</h2>
      <form [formGroup]="newLearningForm" (ngSubmit)="guardarLearning()">
        <mat-form-field appearance="fill">
          <mat-label>Texto del aprendizaje</mat-label>
          <input matInput formControlName="TextoAprendizaje" required>
        </mat-form-field>

        <mat-form-field appearance="fill">
          <mat-label>URL del video</mat-label>
          <input matInput formControlName="Videos">
        </mat-form-field>

        <label for="imagen">Seleccionar imagen</label>
        <input type="file" accept="image/*" (change)="onImageSelected($event)">

        <div class="actions">
          <button mat-raised-button color="primary" type="submit">Guardar</button>
          <button mat-button type="button" (click)="cerrarModal()">Cancelar</button>
        </div>
      </form>
    </div>
  </div>
</div>
