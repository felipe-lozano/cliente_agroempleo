<app-user-header></app-user-header>
<body>
<form (ngSubmit)="onSubmit()" class="login-form">
  <h2>Iniciar sesión</h2>

  <div class="input-group">
    <label for="email">Correo electrónico</label>
    <input type="email" id="email" name="email" [(ngModel)]="email" required />
  </div>

  <div class="input-group password-group">
    <label for="password">Contraseña</label>
    <div class="password-group">
      <input
        [type]="showPassword ? 'text' : 'password'"
        id="password"
        name="password"
        [(ngModel)]="password"
        required
      />
      <button type="button" (click)="togglePassword()" class="eye-icon">
        <i
          class="fas fa-eye"
          *ngIf="!showPassword"
        ></i>
        <i
          class="fas fa-eye-slash"
          *ngIf="showPassword"
        ></i>
      </button>
    </div>
  </div>

  <div class="checkbox-group">
    <label>
      <input type="checkbox" [(ngModel)]="rememberMe" name="remember" />
      Recuérdame
    </label>
  </div>

  <a [routerLink]="['/recuperar']" class="forgot-password">¿Olvidaste tu contraseña?</a>

  <button type="submit" class="login-btn">Iniciar sesión</button>

  <p class="register-link">¿No tienes una cuenta?>
    <a [routerLink]="['/register']">Regístrate aquí</a>
  </p>
</form>
