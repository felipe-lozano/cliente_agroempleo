<div class="login-container">
    <mat-card class="login-card">
      <h1 class="title">AGROEMPLEO</h1>
      <p class="subtitle">Inicia sesión o crea una cuenta</p>
      <p class="subtitle2">Debe iniciar sesión con tu cuenta 
      para acceder a nuestros servicios</p>
  
      <!-- Campo de Usuario -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Usuario</mat-label>
        <input matInput placeholder="Ingrese su usuario">
      </mat-form-field>
  
      <!-- Campo de Contraseña -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Contraseña</mat-label>
        <input matInput [type]="hidePassword ? 'password' : 'text'" placeholder="Ingrese su contraseña">
        <button mat-icon-button matSuffix (click)="hidePassword = !hidePassword">
          <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </mat-form-field>
  
      <!-- Botón de Ingreso -->
      <button mat-raised-button [style.color]="'black'" class="full-width" (click)="login()">Iniciar Sesión</button>
  
      <!-- Enlaces para recuperar contraseña y crear cuenta -->
      <div class="actions">
        <button mat-button [style.color]="'black'" (click)="recoverPassword()">¿Olvidaste tu contraseña?</button>
        <button mat-button [style.color]="'black'" (click)="goToRegister()">Crear cuenta nueva</button>
      </div>
    </mat-card>
  </div>
