<mat-card class="perfil-card">
  <div class="branding">
    <img class="logo-lg" src="/logo.png" alt="Logo" />
    <span class="branding-text">Agroempleo</span>
  </div>
  
  <div class="botones">
  <button mat-raised-button color="primary" (click)="guardarCambios()">Guardar</button>
</div>



  <h2 class="titulo-card">Mi Hoja de Vida</h2>

  <div class="perfil-container">
  <!-- LADO IZQUIERDO: PDF -->
  <div class="columna izquierda">
    <div class="upload-section">
      <mat-label><strong>Subir documento PDF:</strong></mat-label>
      <input type="file" accept=".pdf" (change)="seleccionarDocumento($event)" />
    </div>

    <div *ngIf="documentoUrl" class="visor-pdf">
      <h4>📑 Vista previa del documento</h4>
      <iframe
        [src]="documentoUrl | safeUrl"
        width="100%"
        height="400"
        style="border: 1px solid #ccc; border-radius: 8px;"
      ></iframe>
    </div>
  </div>

  <!-- LADO DERECHO: Imagen -->
  <div class="columna derecha">
    <div class="upload-section">
      <mat-label><strong>Subir Foto:</strong></mat-label>
      <input type="file" (change)="seleccionarImagen($event)" />
    </div>

    <div *ngIf="imagenPrevia" class="imagen-previa">
      <img [src]="imagenPrevia" alt="Imagen de perfil" />
    </div>
  </div>
</div>

    <!-- Columna derecha: imagen y carga -->
    <div class="columna derecha">
      <div *ngIf="imagenPrevia" class="imagen-previa">
        <img [src]="imagenPrevia" alt="Imagen de perfil" />
      </div>
    </div>
  
</mat-card>
