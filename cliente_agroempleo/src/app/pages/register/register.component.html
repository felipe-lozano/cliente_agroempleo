
<form (ngSubmit)="onSubmit()" #registerForm="ngForm">
  <h2>Formulario de Registro</h2>
  <div class="form-group">
    <label for="role">Rol:</label>
    <select id="role" name="role" [(ngModel)]="formData.role" required>
      <option value="">Seleccione un rol</option>
      <option value="empleador">Empleador</option>
      <option value="aspirante">Aspirante</option>
    </select>
  </div>

  <div class="form-group">
    <label for="fullname">Nombre Completo:</label>
    <input type="text" id="fullname" name="fullname" [(ngModel)]="formData.fullname" required />
  </div>

  <div class="form-group">
    <label for="documentType">Tipo de Documento:</label>
    <select id="documentType" name="documentType" [(ngModel)]="formData.documentType" required>
      <option value="">Seleccione</option>
      <option value="cc">Cédula de Ciudadanía</option>
      <option value="passport">Pasaporte</option>
    </select>
  </div>

  <div class="form-group">
    <label for="documentNumber">Número de Documento:</label>
    <input type="text" id="documentNumber" name="documentNumber" [(ngModel)]="formData.documentNumber" required />
  </div>

  <div class="form-group">
    <label for="email">Correo Electrónico:</label>
    <input type="email" id="email" name="email" [(ngModel)]="formData.email" required />
  </div>

  <div class="form-group">
    <label for="address">Dirección:</label>
    <input type="text" id="address" name="address" [(ngModel)]="formData.address" required />
  </div>

  <div class="form-row">
    <div class="form-group">
      <label for="city">Ciudad:</label>
      <input type="text" id="city" name="city" [(ngModel)]="formData.city" required />
    </div>
    <div class="form-group">
      <label for="department">Departamento:</label>
      <input type="text" id="department" name="department" [(ngModel)]="formData.department" required />
    </div>
  </div>

  <div class="form-group">
    <label>Fecha de Nacimiento:</label>
    <div class="form-row">
      <input type="number" name="birthDay" placeholder="Día" min="1" max="31" [(ngModel)]="formData.birthDay" required />
      <input type="number" name="birthMonth" placeholder="Mes" min="1" max="12" [(ngModel)]="formData.birthMonth" required />
      <input type="number" name="birthYear" placeholder="Año" min="1900" max="2007" [(ngModel)]="formData.birthYear" required />
    </div>
  </div>

  <div class="form-group">
    <label for="password">Contraseña:</label>
    <input type="password" id="password" name="password" [(ngModel)]="formData.password" required />
  </div>

  <div class="form-group">
    <label for="confirmPassword">Confirmación de Contraseña:</label>
    <input type="password" id="confirmPassword" name="confirmPassword" [(ngModel)]="formData.confirmPassword" required />
  </div>

  <div class="form-actions">
    <button type="submit" class="accept">Aceptar</button>
    <button routerLink="/login" type="reset" class="cancel" (click)="onReset()">Cancelar</button>
  </div>

</form>
